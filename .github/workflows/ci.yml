# Checks that run before anything lands on main.
#
# Two of the conventions in CLAUDE.md were previously enforced by memory alone:
# that docs/formulation.md is generated rather than hand-edited, and that a
# change to docs/formulation.tex rebuilds the tracked PDF in the same commit.
# Both are checked here. The third, that the README's grid fee error figures
# still match a re-solved run, takes about six minutes and runs on a schedule
# rather than on every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:17 UTC. Off the hour, because everything scheduled on the hour
    # queues behind everything else scheduled on the hour.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the version actually
        # developed against. A failure on 3.11 alone means requires-python lies.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      # Lint is not part of the pytest run, so it is a separate step here too.
      - run: ruff check src tests

      - run: pytest -q

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The .tex/.pdf pairing check diffs against the pull request base.
          fetch-depth: 0

      - name: Install pandoc 3.6.2
        # Pinned. gfm output is not stable across pandoc majors, so an unpinned
        # pandoc would fail this job on a version bump rather than on a real
        # change to the document.
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.6.2/pandoc-3.6.2-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: docs/formulation.md is what pandoc generates from the .tex
        # Only the generated body is compared, not the hand-written header
        # comment, so the header can be reworded without touching this workflow.
        run: |
          pandoc -f latex -t gfm --mathjax docs/formulation.tex > /tmp/body.md
          tail -c "$(wc -c < /tmp/body.md)" docs/formulation.md > /tmp/committed-body.md
          if ! diff -u /tmp/committed-body.md /tmp/body.md; then
            echo "::error file=docs/formulation.md::Generated file is stale or was hand-edited. Regenerate it with the pandoc command in CLAUDE.md."
            exit 1
          fi
          head -1 docs/formulation.md | grep -q 'GENERATED FILE' \
            || { echo "::error file=docs/formulation.md::Lost its GENERATED FILE header."; exit 1; }

      - name: a .tex change must bring the rebuilt .pdf with it
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          if grep -qx 'docs/formulation.tex' <<<"$changed" \
             && ! grep -qx 'docs/formulation.pdf' <<<"$changed"; then
            echo "::error file=docs/formulation.pdf::formulation.tex changed but the tracked PDF did not. Rebuild it (latexmk -pdf, from docs/) and commit both together, or the repository ships a document that disagrees with itself."
            exit 1
          fi

  grid-fee-drift:
    # ~6 minutes, so not on every pull request. It only fails when dispatch or
    # the fee model changes, which a weekly run catches soon enough.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: README grid fee error figures still match a re-solved run
        run: python scripts/measure_grid_fee_error.py --check
