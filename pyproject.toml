[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bess-stack-de"
version = "0.1.0"
description = "Revenue-stacking model for battery energy storage systems in Germany"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    # MILP modelling layer. PuLP bundles CBC and, from 2.8, drives HiGHS via
    # highspy, covering both names allowed in dispatch.solver.name.
    "pulp>=2.8",
    "highspy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bess_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
