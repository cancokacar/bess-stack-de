[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bess-stack-de"
version = "0.1.0"
description = "Revenue-stacking model for battery energy storage systems in Germany"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    # MILP modelling layer. PuLP bundles CBC and drives HiGHS via highspy,
    # covering both names allowed in dispatch.solver.name. Floor is 3.3 for
    # LpProblem.add_variable, the API that survives PuLP 4.0.
    "pulp>=3.3",
    "highspy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

# Generated into the environment's bin/ at install time, so it appears only after a
# reinstall. scripts/run_scenario.py is the same code and needs no reinstall, which is
# why CLAUDE.md documents that form first.
[project.scripts]
bess-stack-run = "bess_stack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bess_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
