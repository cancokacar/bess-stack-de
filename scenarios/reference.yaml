# Reference (baseline) scenario.
#
# ALL VALUES ARE PLACEHOLDERS pending calibration against market data and
# vendor quotes. Units are stated per field: power in MW, energy in MWh,
# capacity prices in EUR/MW/h, energy prices in EUR/MWh.

name: reference
description: >-
  Baseline German BESS case: degradation-aware, rolling-horizon dispatch
  co-optimizing day-ahead arbitrage, FCR capacity and aFRR capacity + energy,
  reported as an annual revenue stack and a project-level IRR.

battery:
  power_mw: 10.0                    # charge/discharge rating at the POI
  energy_mwh: 20.0                  # usable energy at beginning of life (2 h)
  efficiency:
    charge: 0.938                   # one-way; round-trip = charge * discharge
    discharge: 0.938                # => ~0.88 round-trip
    self_discharge_per_day: 0.001   # fraction of rated energy, idle
  soc:
    min: 0.05
    max: 0.95
    initial: 0.50
  aux_load_mw: 0.05                 # BOP/HVAC parasitic draw while online

degradation:
  # Replaces the previous hard cycles-per-year cap: throughput carries a price
  # in the objective, so the optimizer trades cycles against spread instead of
  # being clipped at an arbitrary count.
  # rainflow is path-dependent and not MILP-representable; v1 commits to
  # throughput and keeps the other name only as a forward marker.
  model: throughput                 # throughput | rainflow
  marginal_cost_eur_per_mwh: 4.0    # charged per MWh discharged
  calendar_fade_per_year: 0.015     # fraction of BOL capacity, idle
  cyclic_fade_per_full_cycle: 0.00005
  end_of_life_capacity_fraction: 0.70
  # Identity that must hold whenever the three fields above are edited:
  #   equivalent_full_cycles_to_eol
  #     == (1 - end_of_life_capacity_fraction) / cyclic_fade_per_full_cycle
  #     == 0.30 / 0.00005 == 6000
  # Cyclic fade only. Calendar fade is additive on top, so real end of life
  # arrives before 6000 equivalent full cycles are reached.
  equivalent_full_cycles_to_eol: 6000
  augmentation:
    # Enabled in the reference case by necessity, not preference: 1.5 %/y
    # calendar fade alone leaves 0.985^20 ~= 0.74 of BOL capacity at year 20,
    # and any realistic cycling crosses the 0.70 threshold years earlier. With
    # augmentation disabled, finance.project_lifetime_years must be shortened
    # to match, otherwise the model runs past its own end of life.
    enabled: true
    trigger_capacity_fraction: 0.80
    restore_to_capacity_fraction: 1.00  # usable energy just after an event
    max_events: 2
    cost_eur_per_kwh: 120.0             # on added energy, on finance.basis

market:
  country: DE
  bidding_zone: DE-LU
  year: 2025
  timezone: Europe/Berlin
  resolution_minutes: 15
  price_source: synthetic           # entsoe | smard | synthetic

dispatch:
  # Receding horizon: optimize over `horizon_hours`, commit `commit_step_hours`,
  # roll forward carrying SoC and cumulative degradation across windows.
  mode: rolling_horizon             # rolling_horizon | perfect_foresight
  horizon_hours: 36
  commit_step_hours: 4              # aligned to the 4 h reserve product blocks
  # State of charge required at the far end of each optimisation window. Without
  # it the optimizer empties the battery into the last window step, because
  # stored energy has no value past the horizon. The constraint binds at the
  # horizon, not inside the committed region, so it shapes end effects only.
  terminal_soc_fraction: 0.50
  forecast:
    kind: perfect                   # perfect | persistence | ar1 | external
    # Used only when kind != perfect.
    price_error_sigma_eur_per_mwh: 12.0
    seed: 42
  solver:
    name: highs                     # highs | cbc
    mip_gap: 0.005
    time_limit_s: 60

revenue_streams:
  # NOTE: this was a flat list of stream names; it is now a mapping so each
  # stream carries its own product structure and prices.
  day_ahead:
    enabled: true
    product_resolution_minutes: 60
    spread_haircut: 0.0             # fraction shaved off captured spread
    fees_eur_per_mwh: 0.0

  fcr:
    enabled: true
    # Symmetric capacity product; no energy settlement.
    symmetric: true
    block_hours: 4
    min_bid_mw: 1.0
    # German FCR prequalification requires full activation to be sustainable
    # for 30 minutes in both directions, hence 0.5 h. Understating this lets the
    # optimizer sell the same MW to reserve and arbitrage at once.
    reserve_energy_hours: 0.5       # headroom held per MW awarded
    capacity_price_eur_per_mw_h: 12.0

  afrr:
    enabled: true
    # Separate positive and negative products: capacity payment plus settled
    # energy on activation.
    block_hours: 4
    min_bid_mw: 1.0
    reserve_energy_hours: 1.0       # headroom held per MW awarded
    positive:
      capacity_price_eur_per_mw_h: 8.0
      energy_price_eur_per_mwh: 85.0
      activation_rate: 0.08         # expected fraction of awarded MW activated
    negative:
      capacity_price_eur_per_mw_h: 5.0
      energy_price_eur_per_mwh: -15.0   # negative = paid to absorb
      activation_rate: 0.10

grid:
  connection_limit_mw: 10.0
  # Storage charging has been exempt from grid fees under German law; treat
  # this as an assumption to verify for the modelled year, not a settled fact.
  grid_fee_exemption: true
  charging_fees_eur_per_mwh: 0.0
  discharging_fees_eur_per_mwh: 0.0

finance:
  # BASIS IS DECIDED ONCE, HERE. Every monetary field in this file is
  # interpreted on this basis, including the revenue path. Mixing real and
  # nominal is the most common silent error in models of this kind, so
  # changing `basis` means revisiting discount_rate, opex escalation and
  # debt.interest_rate together, not one at a time.
  basis: real                       # real | nominal
  inflation_per_year: 0.02          # used only to convert between bases

  capex_eur_per_kwh: 250.0
  capex_fixed_eur: 0.0              # development, interconnection, EPC lumps
  opex_eur_per_kw_year: 8.0
  # Cost growth ABOVE inflation. Under `basis: nominal` this field must instead
  # carry full escalation (inflation + real growth).
  opex_real_escalation_per_year: 0.0
  # Post-tax project WACC, stated on `basis` (real). A post-tax discount rate
  # belongs against post-tax cash flows, which is why the reported NPV is the
  # post-tax one.
  discount_rate: 0.07
  # 20 years to match the section 118(6) EnWG exemption window; a shorter
  # horizon cannot show the exemption expiring.
  project_lifetime_years: 20
  residual_value_fraction: 0.0

  # TAX BASIS IS DECIDED ONCE, HERE, the same way `basis` settles real versus
  # nominal. Pre-tax and post-tax IRR are different numbers, so both are
  # reported under explicit names and neither is called plain "IRR" (see
  # `outputs.metrics`). An investor told only "the IRR" will assume whichever
  # of the two was not meant.
  #
  # Combined German corporate rate: corporation tax at 15 % plus the 5.5 %
  # solidarity surcharge levied on it (15.825 % together), plus trade tax,
  # which varies with the municipal Hebesatz and brings the total near 30 %.
  # Confirm against the actual site municipality rather than carrying this
  # placeholder forward.
  tax_rate: 0.30
  depreciation:
    # Without a depreciation shield a post-tax IRR is not merely approximate,
    # it is wrong: taxing EBITDA with no deduction overstates tax in every
    # year of the project. Declaring the shield is what makes irr_post_tax a
    # computable quantity rather than a label.
    method: straight_line           # straight_line | declining_balance
    # PLACEHOLDER, set equal to project life only for want of a confirmed
    # figure; the two are independent. Verify against the applicable AfA
    # table, because a shorter tax life front-loads the shield and raises
    # irr_post_tax without changing a single euro of cash revenue.
    years: 20
    capitalise_augmentation: true   # augmentation capex depreciates from its
                                    # own in-service year, it is not expensed
  # Negative taxable income shields later years rather than being refunded in
  # the year it arises.
  loss_carryforward: true

  debt:
    # Disabled => IRR is reported unlevered (project-level).
    enabled: false
    share_of_capex: 0.60
    # Lending rates are quoted nominal: deflate before use under `basis: real`.
    interest_rate: 0.05
    tenor_years: 10

outputs:
  revenue_stack_by_stream: true
  annual_cashflow: true
  # No bare `irr` or `npv`: every metric names its tax treatment, so a figure
  # cannot be quoted on the wrong basis by accident. NPV is post-tax because
  # finance.discount_rate is a post-tax WACC. LCOS stays pre-tax, being a cost
  # measure by convention.
  metrics:
    - npv_post_tax
    - irr_pre_tax
    - irr_post_tax
    - payback_years
    - lcos_eur_per_mwh
